[project]
name = "scientific-ideation-diversity"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Core science
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.6",
    "pandas>=2.2",
    # Pydantic for schema validation
    "pydantic>=2.10",
    # AWS Bedrock
    "boto3>=1.35",
    "botocore[crt]>=1.35",
    # OpenAI embeddings
    "httpx>=0.28",
    # Visualization
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "umap-learn>=0.5",
    "pypdf>=5",
    # LLM generation utilities (project-local)
    # (utils/LLM.py wraps bedrock/anthropic)
    # SPECTER2 local embedding model
    "torch>=2.6",
    "transformers>=4.49",
    "adapters>=0.2",
    "sentence-transformers>=3.4",
    # Statistics
    "statsmodels>=0.14",
    "pingouin>=0.5",
    "openai>=1.70",
    "google-genai>=1.14",
    "anthropic>=0.40",
    "tenacity>=9.1.4",
    "langfuse>=4.2.0",
    "nltk>=3.9.4",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
